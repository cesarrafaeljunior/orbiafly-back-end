services:
  postgres:
    image: postgres:16.8
    container_name: orbiafly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orbiafly}
      POSTGRES_USER: ${POSTGRES_USER:-orbiafly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${POSTGRES_PORT:-5487}:5432"
    volumes:
      - orbiafly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orbiafly-network

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: orbiafly-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@orbiafly.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbiafly-network

  backend:
    profiles: ["full"]
    build:
      context: .
    image: orbiafly-api:local
    container_name: orbiafly-api
    restart: unless-stopped
    environment:
      APP_PORT: 4000
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-orbiafly}
      DB_USERNAME: ${POSTGRES_USER:-orbiafly}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-123}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201}
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-true}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-key-with-at-least-32-bytes}
      APP_JWT_ISSUER: ${APP_JWT_ISSUER:-orbiafly-api}
      APP_JWT_EXPIRATION_MINUTES: ${APP_JWT_EXPIRATION_MINUTES:-480}
      APP_INITIAL_ADMIN_USERNAME: ${APP_INITIAL_ADMIN_USERNAME:-admin}
      APP_INITIAL_ADMIN_EMAIL: ${APP_INITIAL_ADMIN_EMAIL:-admin@admin.com.br}
      APP_INITIAL_ADMIN_PASSWORD: ${APP_INITIAL_ADMIN_PASSWORD:-admin}
    ports:
      - "${APP_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbiafly-network

volumes:
  orbiafly_postgres_data:

networks:
  orbiafly-network:
    name: orbiafly-network
