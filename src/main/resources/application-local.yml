spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5487}}/${DB_NAME:${POSTGRES_DB:orbiafly}}
    username: ${DB_USERNAME:${POSTGRES_USER:orbiafly}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:orbiafly}}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@admin.com.br}
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin}
  security:
    jwt-secret: ${APP_JWT_SECRET:local-development-secret-key-with-at-least-32-bytes}

logging:
  level:
    com.orbiafly: INFO
