spring:
  application:
    name: orbiafly-api

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:orbiafly}}
    username: ${DB_USERNAME:${POSTGRES_USER:orbiafly}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${APP_PORT:4000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  admin:
    email: ${APP_ADMIN_EMAIL}
    username: ${APP_ADMIN_USERNAME}
    password: ${APP_ADMIN_PASSWORD}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    jwt-issuer: ${APP_JWT_ISSUER:orbiafly-api}
    jwt-audience: ${APP_JWT_AUDIENCE:orbiafly-web}
    jwt-expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:60}
    cookie-secure: ${APP_AUTH_COOKIE_SECURE:false}
    rate-limit-attempts: ${APP_AUTH_RATE_LIMIT_ATTEMPTS:10}
    rate-limit-window-seconds: ${APP_AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201}
