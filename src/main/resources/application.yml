spring:
  application:
    name: orbiafly-api

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DB_HOST:${POSTGRES_HOST:localhost}}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:orbiafly}}
    username: ${DB_USERNAME:${POSTGRES_USER:orbiafly}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:change_me}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${APP_PORT:4000}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true

app:
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://127.0.0.1:4200,http://127.0.0.1:4201}

  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    jwt:
      secret: ${APP_JWT_SECRET:local-development-secret-key-with-at-least-32-bytes}
      issuer: ${APP_JWT_ISSUER:orbiafly-api}
      expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
    initial-admin:
      username: ${APP_INITIAL_ADMIN_USERNAME:admin}
      email: ${APP_INITIAL_ADMIN_EMAIL:admin@admin.com.br}
      password: ${APP_INITIAL_ADMIN_PASSWORD:admin}
